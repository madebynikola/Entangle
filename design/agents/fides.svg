@keyframes ag-markin{0%{opacity:0;transform:scale(1.5)}100%{opacity:1;transform:scale(1)}}.ag-fides .base{fill:#C8463D}.ag-fides .ft{fill:#FFFFFF}.ag-fides .st{stroke:#FFFFFF}
.ag-fides .st{fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.ag-fides .eye,.ag-fides .tilt,.ag-fides .pupil,.ag-fides .eyes{transform-box:fill-box;transform-origin:center}
.ag-fides .gaze{transition:transform .4s cubic-bezier(.45,0,.2,1)}
.ag-fides .happy,.ag-fides .prop{opacity:0}
.ag-fides .happy,.ag-fides .eyes,.ag-fides .tilt{transition:opacity .25s,transform .35s cubic-bezier(.45,0,.2,1)}
.ag-fides .eye{animation:ag-blink 6.2s 2.6s infinite}
.ag-fides[data-state=idle] .eyes{animation:ag-glance 7.5s 4.42s infinite}
.ag-fides[data-state=done] .eyes{opacity:0}
.ag-fides[data-state=done] .happy{opacity:1}
.ag-fides[data-state=done] .head{animation:ag-bob 2.4s infinite}
.ag-fides[data-state=reject] .eyes{transform:translateY(3px) scaleY(.55)}
.ag-fides .paper,.ag-fides .mark,.ag-fides .stamp{transform-box:fill-box;transform-origin:center}
.ag-fides .ul{fill:none;stroke:#C8463D;stroke-width:1.6;stroke-linecap:round}
.ag-fides .mark{opacity:0}
.ag-fides[data-state=working] .paper,.ag-fides[data-state=done] .paper,.ag-fides[data-state=reject] .paper{opacity:1}
.ag-fides[data-state=working] .ul1{animation:ag-ul1 4.4s infinite}
.ag-fides[data-state=working] .ul2{animation:ag-ul2 4.4s infinite}
.ag-fides[data-state=working] .pen{animation:ag-markup 4.4s infinite}
.ag-fides[data-state=working] .eyes{animation:ag-proof 4.4s infinite}
.ag-fides[data-state=done] .stamp{animation:ag-slam 1.3s both}
.ag-fides[data-state=reject] .stamp{animation:ag-slam-no 1.3s both}
.ag-fides[data-state=done] .ok,.ag-fides[data-state=reject] .no{animation:ag-markin .25s .72s both}
.ag-fides[data-state=reject] .eyes{transform:none}
.ag-fides[data-state=reject] .eL .tilt{transform:rotate(22deg)}
.ag-fides[data-state=reject] .eR .tilt{transform:rotate(-22deg)}
.ag-fides[data-state=reject] .head{animation:ag-shake 2.6s infinite}
