<title>Entangle agents</title>

<style>
  body{margin:0;background:#fff;color:#1D1D1F;font-family:"Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  main{max-width:1100px;margin:0 auto;padding:24px 16px 56px}
  .all{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:18px;font-size:14px;color:#6E6E73}
  button{font:500 13px "Inter",sans-serif;border:1px solid #D2D2D7;background:#fff;color:#1D1D1F;border-radius:999px;padding:6px 12px;cursor:pointer}
  button[aria-pressed=true]{border-color:#1D1D1F;box-shadow:inset 0 0 0 1px #1D1D1F}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
  .card{background:#F5F5F7;border-radius:22px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:6px}
  .big{padding:4px 0 6px}
  .name{font-size:20px;font-weight:600;letter-spacing:-0.02em}
  .role{font-size:13px;color:#6E6E73;margin-bottom:6px}
  .st-btns{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
  .st-btns button{padding:4px 9px;font-size:12px}
  .sizes{display:flex;gap:8px;align-items:center;margin-top:10px}
  .sizes .dark{background:#111113;border-radius:10px;padding:5px;display:flex;gap:6px;align-items:center}

<div class="card" data-agent="deneb">
  <div class="big"><svg xmlns="http://www.w3.org/2000/svg" class="ag ag-deneb" data-state="idle" viewBox="0 0 100 100" role="img" aria-label="Deneb, Orchestrator" width="140" height="140"><style>.ag-deneb .base{fill:#1D1D1F}.ag-deneb .ft{fill:#FFFFFF}.ag-deneb .st{stroke:#FFFFFF}
.ag-deneb .st{fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.ag-deneb .eye,.ag-deneb .tilt,.ag-deneb .pupil,.ag-deneb .eyes{transform-box:fill-box;transform-origin:center}
.ag-deneb .gaze{transition:transform .4s cubic-bezier(.45,0,.2,1)}
.ag-deneb .happy,.ag-deneb .prop{opacity:0}
.ag-deneb .happy,.ag-deneb .eyes,.ag-deneb .tilt{transition:opacity .25s,transform .35s cubic-bezier(.45,0,.2,1)}
.ag-deneb .eye{animation:ag-blink 5.2s 0.4s infinite}
.ag-deneb[data-state=idle] .eyes{animation:ag-glance 7.5s 0.68s infinite}
.ag-deneb[data-state=done] .eyes,.ag-deneb[data-state=happy] .eyes{opacity:0}
.ag-deneb[data-state=done] .happy,.ag-deneb[data-state=happy] .happy{opacity:1}
.ag-deneb[data-state=done] .head{animation:ag-bob 2.4s infinite}
.ag-deneb[data-state=reject] .eyes{transform:translateY(3px) scaleY(.55)}
.ag-deneb .baton{transform-box:view-box;transform-origin:72px 74px}
.ag-deneb .clock{transform-box:fill-box;transform-origin:center}
.ag-deneb .minute{transform-box:view-box;transform-origin:20px 30px}
.ag-deneb[data-state=working] .baton{opacity:1;animation:ag-baton 1.8s ease-in-out infinite}
.ag-deneb[data-state=working] .eyes{animation:ag-beat 1.8s ease-in-out infinite}
.ag-deneb[data-state=done] .head{transform-box:fill-box;transform-origin:50% 100%;animation:ag-bow 2.6s infinite}
.ag-deneb[data-state=reject] .clock{animation:ag-pop .5s both}
.ag-deneb[data-state=reject] .minute{animation:ag-spin 1.2s linear infinite}
.ag-deneb[data-state=reject] .eyes{transform:translate(-4px,-3px)}
.ag-deneb[data-state=idle] .baton{animation:ag-q-baton 16s 4s infinite}
.ag-deneb[data-state=reject] .sweat{animation:ag-sweat 2.2s infinite}
@media (prefers-color-scheme:dark){.ag-deneb .base{fill:#48484A}.ag-deneb .ft{fill:#FFFFFF}.ag-deneb .st{stroke:#FFFFFF}}
.dark .ag-deneb .base{fill:#48484A}.dark .ag-deneb .ft{fill:#FFFFFF}.dark .ag-deneb .st{stroke:#FFFFFF}

<script>
const set = (card, s) => {
  card.querySelectorAll("svg.ag").forEach((el) => el.setAttribute("data-state", s));
  card.querySelectorAll(".st-btns button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.s === s));
};
document.querySelectorAll(".card").forEach((c) => { set(c, "idle"); c.querySelectorAll(".st-btns button").forEach((b) => b.onclick = () => set(c, b.dataset.s)); });
document.querySelectorAll("[data-all]").forEach((b) => b.onclick = () => {
  document.querySelectorAll(".card").forEach((c) => set(c, b.dataset.all));
  document.querySelectorAll("[data-all]").forEach((x) => x.setAttribute("aria-pressed", x === b));
});
</script>
