@keyframes ag-markin{0%{opacity:0;transform:scale(1.5)}100%{opacity:1;transform:scale(1)}}.ag-tinta .base{fill:#13807A}.ag-tinta .ft{fill:#FFFFFF}.ag-tinta .st{stroke:#FFFFFF}
.ag-tinta .st{fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.ag-tinta .eye,.ag-tinta .tilt,.ag-tinta .pupil,.ag-tinta .eyes{transform-box:fill-box;transform-origin:center}
.ag-tinta .gaze{transition:transform .4s cubic-bezier(.45,0,.2,1)}
.ag-tinta .happy,.ag-tinta .prop{opacity:0}
.ag-tinta .happy,.ag-tinta .eyes,.ag-tinta .tilt{transition:opacity .25s,transform .35s cubic-bezier(.45,0,.2,1)}
.ag-tinta .eye{animation:ag-blink 5.4s 1.7s infinite}
.ag-tinta[data-state=idle] .eyes{animation:ag-glance 7.5s 2.8899999999999997s infinite}
.ag-tinta[data-state=done] .eyes,.ag-tinta[data-state=happy] .eyes{opacity:0}
.ag-tinta[data-state=done] .happy,.ag-tinta[data-state=happy] .happy{opacity:1}
.ag-tinta[data-state=done] .head{animation:ag-bob 2.4s infinite}
.ag-tinta[data-state=reject] .eyes{transform:translateY(3px) scaleY(.55)}
.ag-tinta .ln{fill:none;stroke:#13807A;stroke-width:1.8;stroke-linecap:round}
.ag-tinta .page,.ag-tinta .ball,.ag-tinta .plane{transform-box:fill-box;transform-origin:center}
.ag-tinta[data-state=working] .page{opacity:1}
.ag-tinta[data-state=working] .l1{animation:ag-l1 4.6s infinite}
.ag-tinta[data-state=working] .l2{animation:ag-l2 4.6s infinite}
.ag-tinta[data-state=working] .l3{animation:ag-l3 4.6s infinite}
.ag-tinta[data-state=working] .hand{animation:ag-write 4.6s infinite}
.ag-tinta[data-state=working] .eyes{animation:ag-follow3 4.6s infinite}
.ag-tinta[data-state=done] .page{animation:ag-foldpage 2.4s infinite}
.ag-tinta[data-state=done] .plane{animation:ag-fly 2.4s infinite}
.ag-tinta[data-state=reject] .page{animation:ag-crumple 3s infinite}
.ag-tinta[data-state=reject] .ball{animation:ag-toss 3s infinite}
.ag-tinta[data-state=idle] .hand{animation:ag-q-click 16s 7s infinite}
.ag-tinta[data-state=reject] .sweat{animation:ag-sweat 2.2s infinite}
@media (prefers-color-scheme:dark){}

