@keyframes ag-markin{0%{opacity:0;transform:scale(1.5)}100%{opacity:1;transform:scale(1)}}.ag-tycho .base{fill:#4C5BD4}.ag-tycho .ft{fill:#FFFFFF}.ag-tycho .st{stroke:#FFFFFF}
.ag-tycho .st{fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.ag-tycho .eye,.ag-tycho .tilt,.ag-tycho .pupil,.ag-tycho .eyes{transform-box:fill-box;transform-origin:center}
.ag-tycho .gaze{transition:transform .4s cubic-bezier(.45,0,.2,1)}
.ag-tycho .happy,.ag-tycho .prop{opacity:0}
.ag-tycho .happy,.ag-tycho .eyes,.ag-tycho .tilt{transition:opacity .25s,transform .35s cubic-bezier(.45,0,.2,1)}
.ag-tycho .eye{animation:ag-blink 5.8s 2.1s infinite}
.ag-tycho[data-state=idle] .eyes{animation:ag-glance 7.5s 3.57s infinite}
.ag-tycho[data-state=done] .eyes{opacity:0}
.ag-tycho[data-state=done] .happy{opacity:1}
.ag-tycho[data-state=done] .head{animation:ag-bob 2.4s infinite}
.ag-tycho[data-state=reject] .eyes{transform:translateY(3px) scaleY(.55)}
.ag-tycho .leaf,.ag-tycho .pageL{transform-box:view-box;transform-origin:50px 78px}
.ag-tycho .leaf{opacity:0}
.ag-tycho .stack{transform-box:fill-box;transform-origin:center}
.ag-tycho[data-state=working] .book{opacity:1}
.ag-tycho[data-state=working] .eyes{animation:ag-readbook 4.2s infinite}
.ag-tycho[data-state=working] .leaf{animation:ag-leaf 4.2s infinite}
.ag-tycho[data-state=done] .book{animation:ag-shut 1.8s both}
.ag-tycho[data-state=done] .pageL{animation:ag-fold 1.8s both}
.ag-tycho[data-state=done] .stack{animation:ag-stackin 1.8s both}
.ag-tycho[data-state=done] .topbook{animation:ag-drop 1.8s both}
.ag-tycho[data-state=idle] .book{animation:ag-q-book 18s 9s infinite}
.ag-tycho[data-state=idle] .leaf{animation:ag-q-leaf 18s 9s infinite}
.ag-tycho[data-state=reject] .sweat{animation:ag-sweat 2.2s infinite}
