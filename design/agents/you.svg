@keyframes ag-markin{0%{opacity:0;transform:scale(1.5)}100%{opacity:1;transform:scale(1)}}.ag-you .base{fill:#C7C7CC}.ag-you .ft{fill:#1D1D1F}.ag-you .st{stroke:#1D1D1F}
.ag-you .st{fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.ag-you .eye,.ag-you .tilt,.ag-you .pupil,.ag-you .eyes{transform-box:fill-box;transform-origin:center}
.ag-you .gaze{transition:transform .4s cubic-bezier(.45,0,.2,1)}
.ag-you .happy,.ag-you .prop{opacity:0}
.ag-you .happy,.ag-you .eyes,.ag-you .tilt{transition:opacity .25s,transform .35s cubic-bezier(.45,0,.2,1)}
.ag-you .eye{animation:ag-blink 5s 3s infinite}
.ag-you[data-state=idle] .eyes{animation:ag-glance 7.5s 5.1s infinite}
.ag-you[data-state=done] .eyes,.ag-you[data-state=happy] .eyes{opacity:0}
.ag-you[data-state=done] .happy,.ag-you[data-state=happy] .happy{opacity:1}
.ag-you[data-state=done] .head{animation:ag-bob 2.4s infinite}
.ag-you[data-state=reject] .eyes{transform:translateY(3px) scaleY(.55)}
.ag-you .hl,.ag-you .hr,.ag-you .thumb,.ag-you .flip{transform-box:fill-box;transform-origin:center}
.ag-you[data-state=working] .kb{opacity:1}
.ag-you[data-state=working] .hl{animation:ag-tap .32s ease-in-out infinite alternate}
.ag-you[data-state=working] .hr{animation:ag-tap .32s .16s ease-in-out infinite alternate}
.ag-you[data-state=working] .eyes{transform:translateY(3px)}
.ag-you[data-state=done] .thumb{opacity:1;animation:ag-thumb .6s both,ag-wag 1.8s .6s infinite}
.ag-you[data-state=reject] .thumb{opacity:1;animation:ag-thumb-no .6s both,ag-wag 1.8s .6s infinite}
.ag-you[data-state=reject] .flip{transform:rotate(180deg)}
.ag-you[data-state=done] .head{transform-box:fill-box;transform-origin:50% 100%;animation:ag-nod 1.6s infinite}
@media (prefers-color-scheme:dark){.ag-you .base{fill:#3A3A3C}.ag-you .ft{fill:#FFFFFF}.ag-you .st{stroke:#FFFFFF}}
.dark .ag-you .base{fill:#3A3A3C}.dark .ag-you .ft{fill:#FFFFFF}.dark .ag-you .st{stroke:#FFFFFF}
@media (prefers-reduced-motion:reduce){.ag-you *{animation:none!important;transition:none!important}}</style><g class="head"><path class="base" d="M36 22H64A28 28 0 0 1 64 78H36A28 28 0 0 1 36 22Z"/>

