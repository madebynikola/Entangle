@keyframes ag-markin{0%{opacity:0;transform:scale(1.5)}100%{opacity:1;transform:scale(1)}}.ag-spica .base{fill:#A46719}.ag-spica .ft{fill:#FFFFFF}.ag-spica .st{stroke:#FFFFFF}
.ag-spica .st{fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.ag-spica .eye,.ag-spica .tilt,.ag-spica .pupil,.ag-spica .eyes{transform-box:fill-box;transform-origin:center}
.ag-spica .gaze{transition:transform .4s cubic-bezier(.45,0,.2,1)}
.ag-spica .happy,.ag-spica .prop{opacity:0}
.ag-spica .happy,.ag-spica .eyes,.ag-spica .tilt{transition:opacity .25s,transform .35s cubic-bezier(.45,0,.2,1)}
.ag-spica .eye{animation:ag-blink 4.6s 1.3s infinite}
.ag-spica[data-state=idle] .eyes{animation:ag-glance 7.5s 2.21s infinite}
.ag-spica[data-state=done] .eyes{opacity:0}
.ag-spica[data-state=done] .happy{opacity:1}
.ag-spica[data-state=done] .head{animation:ag-bob 2.4s infinite}
.ag-spica[data-state=reject] .eyes{transform:translateY(3px) scaleY(.55)}
.ag-spica .bulb,.ag-spica .rays{transform-box:fill-box;transform-origin:center}
.ag-spica .fog{opacity:0}
.ag-spica[data-state=working] .lens{animation:ag-lens 3.8s infinite}
.ag-spica[data-state=working] .eR .pupil{animation:ag-magR 3.8s infinite}
.ag-spica[data-state=working] .eL .pupil{animation:ag-magL 3.8s infinite}
.ag-spica[data-state=working] .bulb{animation:ag-aha 3.8s infinite}
.ag-spica[data-state=done] .bulb{opacity:1}
.ag-spica[data-state=done] .rays{animation:ag-glow 1.1s ease-in-out infinite}
.ag-spica[data-state=reject] .lens{opacity:1;transform:translate(61px,52px)}
.ag-spica[data-state=reject] .fog{animation:ag-fog 2.6s infinite}
.ag-spica[data-state=idle] .lens{animation:ag-q-lens 17s 6s infinite}
.ag-spica[data-state=reject] .sweat{animation:ag-sweat 2.2s infinite}
