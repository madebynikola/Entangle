<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Entangle demo</title>
<!--
	The director page of the demo video (scripts/demo/record.ts serves it). The app runs in the iframe; this page is the
	camera around it: it frames, zooms, blurs and cuts, and lays titles, captions and a cursor over it.
	All sizes are CSS px of a 1440×810 window; Chrome renders it at 4/3, so the video is 1920×1080.
-->
<style>
	@font-face { font-family: "Inter Variable"; font-weight: 100 900; src: url(/__demo/fonts/inter-latin-wght-normal.woff2) format("woff2"); }
	@font-face { font-family: "Inter Variable"; font-weight: 100 900; src: url(/__demo/fonts/inter-latin-ext-wght-normal.woff2) format("woff2"); unicode-range: U+0100-024F, U+1E00-1EFF; }
	@font-face { font-family: "Source Serif 4 Variable"; font-weight: 200 900; src: url(/__demo/fonts/source-serif-4-latin-wght-normal.woff2) format("woff2"); }
	@font-face { font-family: "Source Serif 4 Variable"; font-style: italic; font-weight: 200 900; src: url(/__demo/fonts/source-serif-4-latin-wght-italic.woff2) format("woff2"); }

	:root {
		/* The demo is dark: the app's Night theme. */
		color-scheme: dark;
		--ink: #f5f5f7; --muted: #a1a1a6; --subtle: #7c7c82; --accent: #8b97f2; --canvas: #0b0b0c; --panel: #111113;
		--chip: #1c1c1f; --ring: rgba(255, 255, 255, 0.09);
		--ease: cubic-bezier(0.7, 0, 0.2, 1); --out: cubic-bezier(0.2, 0.8, 0.2, 1);
		--sans: "Inter Variable", Inter, system-ui, sans-serif; --serif: "Source Serif 4 Variable", Georgia, serif;
	}
	* { box-sizing: border-box; }
	html, body { margin: 0; height: 100%; overflow: hidden; background: var(--canvas); color: var(--ink); font-family: var(--sans);
		-webkit-font-smoothing: antialiased; }

	/* The backdrop the framed window floats on: a soft light from above, a faint dot grid. */
	#backdrop { position: fixed; inset: 0;
		background:
			radial-gradient(1100px 520px at 50% -12%, rgba(139, 151, 242, 0.16), transparent 70%),
			radial-gradient(800px 500px at 100% 110%, rgba(139, 151, 242, 0.08), transparent 70%),
			radial-gradient(circle at 1px 1px, rgba(255, 255, 255, 0.055) 1px, transparent 0) 0 0 / 22px 22px,
			var(--canvas); }

	#stage { position: fixed; inset: 0; perspective: 2600px; will-change: filter, opacity, translate; }
	#stage.blur { filter: blur(22px) saturate(1.05); opacity: 0.28; }
	#stage.soft { filter: blur(6px); opacity: 0.7; }
	#cam { position: absolute; left: 0; top: 0; width: 1440px; height: 810px; transform-origin: 0 0; }
	#win { width: 100%; height: 100%; overflow: hidden; background: var(--panel); border-radius: 0;
		transition: border-radius 600ms var(--ease), box-shadow 600ms var(--ease); }
	#win.framed { border-radius: 14px; box-shadow: 0 0 0 1px var(--ring), 0 30px 80px -20px rgba(0, 0, 0, 0.7), 0 12px 28px -12px rgba(0, 0, 0, 0.5); }
	#app { display: block; width: 1440px; height: 810px; border: 0; }

	/* Titles: words blur in one after another. */
	#titles { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; }
	#titles .card { display: flex; flex-direction: column; align-items: center; gap: 22px; max-width: 1120px; text-align: center; }
	#titles .kicker { font-size: 15px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); }
	#titles .line { font-family: var(--serif); font-weight: 500; font-size: 64px; line-height: 1.12; letter-spacing: -0.025em; }
	#titles .line.small { font-size: 46px; }
	#titles .sub { font-size: 22px; line-height: 1.5; color: var(--muted); max-width: 820px; }
	#titles .code { font-size: 20px; padding: 10px 18px; border-radius: 10px; background: rgba(255, 255, 255, 0.07); }
	#titles img.lockup { width: 400px; height: auto; }
	#titles .w, #titles .fade, #intro .in, #panel .in { will-change: opacity, filter, transform, translate; }
	#titles .w { display: inline-block; white-space: pre; opacity: 0; filter: blur(12px); transform: translateY(18px);
		animation: word-in 760ms var(--out) forwards; animation-delay: calc(var(--i) * 75ms); }
	#titles .em { color: var(--accent); }
	#titles .fade { opacity: 0; animation: fade-in 700ms var(--out) forwards; animation-delay: calc(var(--i) * 75ms); }
	#titles.out .w, #titles.out .fade { animation: word-out 420ms var(--ease) forwards; animation-delay: calc(var(--i) * 18ms); }
	@keyframes word-in { to { opacity: 1; filter: blur(0); transform: none; } }
	@keyframes fade-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
	@keyframes word-out { from { opacity: 1; filter: blur(0); transform: none; } to { opacity: 0; filter: blur(10px); transform: translateY(-14px); } }

	/* The caption: a kicker and one sentence, low on the screen. */
	#caption { position: fixed; left: 50%; bottom: 26px; pointer-events: none; translate: -50% 12px; display: flex; flex-direction: column; align-items: center; gap: 6px;
		max-width: 1000px; padding: 14px 26px 15px; border-radius: 18px; text-align: center; opacity: 0;
		background: rgba(28, 28, 31, 0.86); backdrop-filter: blur(16px) saturate(1.4); will-change: opacity, translate;
		box-shadow: 0 0 0 1px var(--ring), 0 18px 40px -12px rgba(0, 0, 0, 0.6);
		transition: opacity 420ms var(--out), translate 420ms var(--out); }
	#caption.on { opacity: 1; translate: -50% 0; }
	#caption .kicker { font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); }
	#caption .text { font-size: 23px; font-weight: 500; line-height: 1.38; letter-spacing: -0.012em; }
	#caption .text b { font-weight: 650; }

	/* A macOS-like pointer, with a ring on click. */
	#cursor { position: fixed; left: 0; top: 0; width: 28px; height: 28px; pointer-events: none; opacity: 0; transition: opacity 240ms ease; z-index: 10; }
	#cursor.on { opacity: 1; }
	#cursor svg { position: absolute; left: -5px; top: -3px; width: 28px; height: 28px; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.25));
		transition: scale 140ms ease; transform-origin: 5px 3px; }
	#cursor.down svg { scale: 0.86; }
	#cursor .ring { position: absolute; left: -22px; top: -22px; width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--accent);
		opacity: 0; scale: 0.4; }
	#cursor .ring.go { animation: ring 560ms var(--out); }
	@keyframes ring { 0% { opacity: 0.9; scale: 0.4; } 100% { opacity: 0; scale: 1.25; } }

	/* Isolation: the app's page is hidden and only the marked components float on the backdrop (see iso()). */
	#win.iso { background: transparent; box-shadow: none; border-radius: 0; transition: none; }
	#stage { translate: 0 0; }
	#stage.gone { filter: blur(14px); opacity: 0; translate: 0 26px; }
	#stage { transition: filter 520ms var(--out), opacity 520ms var(--out), translate 620ms var(--out); }

	/* An agent's introduction: its face, name, role and model, on the left. Its real work floats on the right. */
	#intro { position: fixed; left: 96px; top: 50%; translate: 0 -50%; width: 470px; display: flex; flex-direction: column; gap: 0; pointer-events: none; }
	#intro .face { width: 196px; height: 196px; margin: 0 0 30px -10px; display: grid; place-items: center; }
	#intro .face .pop { --size: 196px; width: 0; height: 0; opacity: 0; animation: pop 900ms cubic-bezier(0.34, 1.5, 0.6, 1) forwards; }
	#intro .face svg { width: 100%; height: 100%; overflow: visible; }
	#intro .num { font-size: 14px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--role); margin-bottom: 10px; }
	#intro .name { font-family: var(--serif); font-weight: 500; font-size: 86px; line-height: 1; letter-spacing: -0.03em; margin-bottom: 18px; }
	#intro .job { font-size: 24px; line-height: 1.42; color: var(--muted); letter-spacing: -0.01em; margin-bottom: 26px; }
	#intro .job b { color: var(--ink); font-weight: 600; }
	#intro .model { align-self: flex-start; display: inline-flex; align-items: center; gap: 10px; padding: 9px 16px 9px 13px; border-radius: 999px;
		font-size: 17px; font-weight: 550; background: var(--chip); box-shadow: 0 0 0 1px var(--ring), 0 8px 20px -10px rgba(0, 0, 0, 0.6); }
	#intro .model i { width: 9px; height: 9px; border-radius: 50%; background: var(--role); }
	#intro .model span { color: var(--muted); font-weight: 450; }
	#intro .in { opacity: 0; filter: blur(10px); translate: 0 16px; animation: word-in2 700ms var(--out) forwards; animation-delay: calc(180ms + var(--i) * 90ms); }
	#intro.out > * { animation: word-out 420ms var(--ease) forwards !important; animation-delay: calc(var(--i, 0) * 30ms) !important; }
	/* The size itself grows, not a scale: the face is drawn sharp at every frame, so nothing snaps when it stops. */
	@keyframes pop { from { width: calc(var(--size) * 0.3); height: calc(var(--size) * 0.3); opacity: 0; } 40% { opacity: 1; } to { width: var(--size); height: var(--size); opacity: 1; } }
	@keyframes word-in2 { to { opacity: 1; filter: blur(0); translate: 0 0; } }

	/* The roster: the nine faces in a row at the bottom, the one being introduced lit up. */
	#roster { position: fixed; left: 50%; bottom: 30px; translate: -50% 20px; display: flex; gap: 16px; opacity: 0; pointer-events: none;
		transition: opacity 500ms var(--out), translate 500ms var(--out); }
	#roster.on { opacity: 1; translate: -50% 0; }
	#roster .m { width: 34px; height: 34px; display: grid; place-items: center; opacity: 0.28; filter: grayscale(0.6); transition: opacity 400ms var(--out), filter 400ms; }
	#roster .m svg { width: 34px; height: 34px; transition: width 500ms cubic-bezier(0.34, 1.5, 0.6, 1), height 500ms cubic-bezier(0.34, 1.5, 0.6, 1); }
	#roster .m.on svg { width: 44px; height: 44px; }
	#roster .m.seen { opacity: 0.55; filter: none; }
	#roster .m.on { opacity: 1; filter: none; }


	/* A row of faces on a title card. */
	#titles .faces { display: flex; gap: 26px; margin-bottom: 18px; }
	#titles .faces .f { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 96px; }
	#titles .faces .f .box { width: 96px; height: 96px; display: grid; place-items: center; }
	#titles .faces .f .pop { --size: 96px; width: 0; height: 0; opacity: 0; animation: pop 800ms cubic-bezier(0.34, 1.5, 0.6, 1) forwards; animation-delay: calc(var(--i) * 85ms); }
	#titles .faces .f span { opacity: 0; animation: fade-in 600ms var(--out) forwards; animation-delay: calc(200ms + var(--i) * 85ms); }
	#titles .faces svg { width: 100%; height: 100%; }
	#titles .faces span { font-size: 15px; font-weight: 600; color: var(--muted); }
	#titles.out .faces .f { animation: word-out 420ms var(--ease) forwards; animation-delay: calc(var(--i) * 25ms); }

	/* A panel the director draws itself, in the component's place: Libra's count, the run's numbers. */
	#panel { position: fixed; inset: 0; pointer-events: none; }
	#panel .box { position: absolute; display: grid; place-items: center; }
	#panel .tally { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
	#panel .tally .big { font-family: var(--serif); font-size: 150px; font-weight: 500; letter-spacing: -0.04em; line-height: 1; font-variant-numeric: tabular-nums; }
	#panel .tally .lab { font-size: 24px; color: var(--muted); }
	#panel .tally .arrow { font-size: 40px; color: var(--subtle); margin: 6px 0; }
	#panel .grid { display: grid; grid-template-columns: repeat(4, 262px); gap: 24px; }
	#panel .stat { padding: 30px 26px 26px; border-radius: 22px; background: #151517; box-shadow: 0 0 0 1px var(--ring), 0 24px 50px -24px rgba(0, 0, 0, 0.7); }
	#panel .stat .n { font-family: var(--serif); font-size: 76px; font-weight: 500; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
	#panel .stat .l { margin-top: 12px; font-size: 20px; line-height: 1.35; color: var(--muted); }
	#panel .stat svg { width: 58px; height: 58px; margin-bottom: 18px; }
	#panel .in { opacity: 0; filter: blur(10px); translate: 0 20px; animation: word-in2 760ms var(--out) forwards; animation-delay: calc(var(--i) * 110ms); }
	#panel.out .in { animation: word-out 420ms var(--ease) forwards; animation-delay: calc(var(--i) * 30ms); }
</style>
</head>
<body>
	<div id="backdrop"></div>
	<div id="stage"><div id="cam"><div id="win"><iframe id="app" title="Entangle"></iframe></div></div></div>
	<div id="panel"></div>
	<div id="intro"></div>
	<div id="roster"></div>
	<div id="titles"></div>
	<div id="caption"><div class="kicker"></div><div class="text"></div></div>
	<div id="cursor"><div class="ring"></div><svg viewBox="0 0 28 28"><path d="M5 3 L5 22 L10 17.5 L13.5 25 L17 23.4 L13.6 16 L20 16 Z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg></div>
<script>
	const W = 1440, H = 810
	const $ = (id) => document.getElementById(id)
	const sleep = (ms) => new Promise((done) => setTimeout(done, ms))
	const app = $("app"), cam = $("cam"), win = $("win"), stage = $("stage"), titles = $("titles"), caption = $("caption"), cursor = $("cursor")
	const intro = $("intro"), roster = $("roster"), panel = $("panel")

	/** Where the camera is: screen = (tx, ty) + s × app. */
	let view = { s: 1, tx: 0, ty: 0, rx: 0, ry: 0 }
	let isolated = false

	/** The agents' faces from the brand kit, inlined so their state can change. Each SVG carries its own CSS. */
	const FACE_IDS = ["deneb", "spica", "libra", "tycho", "fides", "amity", "tinta", "ceres", "you"]
	const FACES = {}
	const FACE_NAME = { deneb: "Deneb", spica: "Spica", libra: "Libra", tycho: "Tycho", fides: "Fides", amity: "Amity", tinta: "Tinta", ceres: "Ceres", you: "You" }
	const facesReady = Promise.all(FACE_IDS.map(async (id) => { FACES[id] = await (await fetch(`/__demo/agents/${id}.svg`)).text() }))
	const faceSvg = (id, state = "idle") => FACES[id].replace(/<svg\b([^>]*?)data-state="[^"]*"/, `<svg$1data-state="${state}"`).replace(/<\?xml[^>]*>/, "")

	/** Hide the app's page and keep only elements marked data-iso; data-iso-hide hides a part of one. */
	const ISO_CSS = `
		html.iso, html.iso body, html.iso #root { background: transparent !important; }
		html.iso body * { visibility: hidden !important; }
		html.iso [data-iso], html.iso [data-iso] * { visibility: visible !important; }
		[data-iso] [data-iso-hide] { display: none !important; }
		html.iso [data-iso][data-iso-card] { background: var(--panel) !important; border-radius: 12px;
			box-shadow: 0 0 0 20px var(--panel), 0 0 0 21px rgba(255, 255, 255, 0.09), 0 40px 90px -24px rgba(0, 0, 0, 0.8) !important; }
		html.iso .stage-canvas[data-iso] { background: transparent !important; }
		html.iso [data-sonner-toaster] { display: none !important; }`

	/** cubic-bezier(x1, y1, x2, y2) as a function of time, like CSS. */
	function bezier(x1, y1, x2, y2) {
		const at = (a, b, t) => 3 * a * t * (1 - t) ** 2 + 3 * b * t * t * (1 - t) + t ** 3
		return (x) => {
			let lo = 0, hi = 1
			for (let i = 0; i < 30; i++) {
				const mid = (lo + hi) / 2
				if (at(x1, x2, mid) < x) lo = mid
				else hi = mid
			}
			return at(y1, y2, (lo + hi) / 2)
		}
	}
	const EASE = bezier(0.7, 0, 0.2, 1)
	const css = ({ s, tx, ty, rx, ry }) =>
		`translate(${tx}px, ${ty}px) scale(${s})` + (rx || ry ? ` translate(${W / 2}px, ${H / 2}px) rotateX(${rx}deg) rotateY(${ry}deg) translate(${-W / 2}px, ${-H / 2}px)` : "")
	let moving = 0

	/**
	 * Move the camera frame by frame. A CSS transition would scale a picture of the page and draw it sharp again only
	 * when it stops, which shows as a snap at the end of every move.
	 */
	function apply(next, ms) {
		const from = view
		view = next
		const id = ++moving
		if (!ms) {
			cam.style.transform = css(next)
			return sleep(0)
		}
		return new Promise((done) => {
			const start = performance.now()
			const step = (now) => {
				if (id !== moving) return done()
				const t = Math.min(1, (now - start) / ms)
				const e = EASE(t)
				const mix = (k) => from[k] + (next[k] - from[k]) * e
				cam.style.transform = css({ s: mix("s"), tx: mix("tx"), ty: mix("ty"), rx: mix("rx"), ry: mix("ry") })
				if (t < 1) requestAnimationFrame(step)
				else done()
			}
			requestAnimationFrame(step)
		})
	}

	/** The camera framings. A rect is in app px: the camera fits it to the screen, never showing past the window's edge. */
	function shot(spec) {
		if (spec === "full") return { s: 1, tx: 0, ty: 0, rx: 0, ry: 0 }
		if (spec === "frame" || spec === "tilt") {
			const s = 0.82
			return { s, tx: (W - W * s) / 2, ty: 30, rx: spec === "tilt" ? 14 : 0, ry: spec === "tilt" ? -9 : 0 }
		}
		const { x, y, w, h } = spec.rect
		const pad = spec.pad ?? 0.12
		// The screen box to fit into: the whole screen, or a part of it (an isolated component beside an intro).
		const box = spec.box ?? { x: 0, y: 0, w: W, h: H }
		let s = Math.min(box.w / (w * (1 + pad)), box.h / (h * (1 + pad)))
		s = Math.max(spec.min ?? (spec.box ? 0.3 : 1), Math.min(spec.max ?? 2.4, s))
		let tx = box.x + box.w / 2 - s * (x + w / 2)
		let ty = box.y + box.h / 2 - s * (y + h / 2) + (spec.lift ?? 0)
		// With the page around it, never show past the window's edge. Isolated, there is no edge.
		if (!isolated) {
			tx = Math.min(0, Math.max(W - W * s, tx))
			ty = Math.min(0, Math.max(H - H * s, ty))
		}
		return { s, tx, ty, rx: 0, ry: 0 }
	}

	window.director = {
		load(url) {
			return new Promise((done) => {
				app.addEventListener("load", () => done(), { once: true })
				app.src = url
			})
		},
		camera(spec, ms = 1100, ease) {
			const next = shot(spec)
			win.classList.toggle("framed", next.s < 1)
			return apply(next, ms, ease)
		},
		/** Isolate: only the app's marked components show, on the backdrop. */
		iso(on) {
			isolated = on
			win.classList.toggle("iso", on)
			const doc = app.contentDocument
			if (!doc.getElementById("demo-iso")) {
				const style = doc.createElement("style")
				style.id = "demo-iso"
				style.textContent = ISO_CSS
				doc.head.append(style)
			}
			doc.documentElement.classList.toggle("iso", on)
			if (!on)
				for (const el of doc.querySelectorAll("[data-iso], [data-iso-hide]")) {
					if (el.hasAttribute("data-iso")) el.style.maxWidth = ""
					for (const name of ["data-iso", "data-iso-card", "data-iso-hide"]) el.removeAttribute(name)
				}
		},
		/** The stage in or out: "gone" fades it down and away, for a cut between isolated components. */
		stage(mode, ms = 560) {
			stage.classList.toggle("gone", mode === "gone")
			return sleep(ms)
		},
		ready() {
			return facesReady
		},
		/** Introduce one agent on the left. */
		async meet(spec) {
			await facesReady
			intro.classList.remove("out")
			intro.style.setProperty("--role", spec.color)
			let i = 0
			const line = (cls, html) => `<div class="${cls} in" style="--i:${i++}">${html}</div>`
			intro.innerHTML =
				`<div class="face"><div class="pop">${faceSvg(spec.face, "idle")}</div></div>` +
				line("num", spec.kicker) +
				line("name", spec.name) +
				line("job", spec.job) +
				line("model", `<i></i>${spec.model}`)
			for (const m of roster.querySelectorAll(".m")) {
				if (m.classList.contains("on")) m.classList.add("seen")
				m.classList.toggle("on", m.dataset.face === spec.face)
			}
			await sleep(900)
		},
		mood(state) {
			intro.querySelector(".face svg")?.setAttribute("data-state", state)
		},
		async unmeet() {
			intro.classList.add("out")
			await sleep(460)
			intro.innerHTML = ""
			intro.classList.remove("out")
		},
		async roster(on) {
			await facesReady
			if (on && !roster.children.length) roster.innerHTML = FACE_IDS.map((id) => `<div class="m" data-face="${id}">${faceSvg(id, "idle")}</div>`).join("")
			roster.classList.toggle("on", on)
		},
		/** Draw in the component's place. kind "tally": from → to; kind "stats": a row of numbers. */
		async panel(spec) {
			await facesReady
			panel.classList.remove("out")
			const b = spec.box ?? { x: 0, y: 0, w: W, h: H }
			let html = ""
			if (spec.kind === "tally") {
				html = `<div class="tally">
					<div class="big in" style="--i:0"><span class="count" data-to="${spec.from}" data-ms="900">0</span></div>
					<div class="lab in" style="--i:1">${spec.fromLabel}</div>
					<div class="arrow in" style="--i:5">↓</div>
					<div class="big in" style="--i:6; color:${spec.color}"><span class="count" data-from="${spec.from}" data-to="${spec.to}" data-delay="1500" data-ms="1300">${spec.from}</span></div>
					<div class="lab in" style="--i:7">${spec.toLabel}</div></div>`
			} else {
				html = `<div class="grid">${spec.stats.map((stat, k) => `<div class="stat in" style="--i:${k}">${stat.face ? faceSvg(stat.face, "done") : ""}
					<div class="n">${stat.prefix ?? ""}<span class="count" data-to="${stat.n}" data-delay="${300 + k * 110}">0</span>${stat.suffix ?? ""}</div><div class="l">${stat.label}</div></div>`).join("")}</div>`
			}
			panel.innerHTML = `<div class="box" style="left:${b.x}px;top:${b.y}px;width:${b.w}px;height:${b.h}px">${html}</div>`
			for (const el of panel.querySelectorAll(".count")) countUp(el, Number(el.dataset.to), Number(el.dataset.from ?? 0), Number(el.dataset.delay ?? 250), Number(el.dataset.ms ?? 1300))
			await sleep(800)
		},
		async unpanel() {
			panel.classList.add("out")
			await sleep(460)
			panel.innerHTML = ""
			panel.classList.remove("out")
		},
		/** App px to screen px, for the camera's target. */
		toScreen(x, y) {
			return { x: view.tx + view.s * x, y: view.ty + view.s * y }
		},
		blur(mode, ms = 420) {
			stage.classList.toggle("blur", mode === "blur")
			stage.classList.toggle("soft", mode === "soft")
			return sleep(ms)
		},
		/** Lines of a title card. `*word*` is accent, `{1047}` counts up, `[code]` is a code chip, `<img>` the lockup. */
		async title(spec) {
			titles.classList.remove("out")
			let i = 0
			// `*several words*` is accent; each word still animates on its own.
			const words = (text) =>
				text.split(/(\*[^*]+\*)/).map((segment) => {
					const em = /^\*([^*]+)\*$/.exec(segment)
					return (em ? em[1] : segment).split(/(\s+)/).map((part) => {
						if (!part || /^\s+$/.test(part)) return part
						const count = /^\{(\d+)\}(.*)$/.exec(part)
						const html = count ? `<span class="count" data-to="${count[1]}">0</span>${count[2]}` : part
						return `<span class="w${em ? " em" : ""}" style="--i:${i++}">${html}</span>`
					}).join("")
				}).join("")
			const parts = []
			if (spec.faces) {
				await facesReady
				parts.push(`<div class="faces">${spec.faces.map((id) => `<div class="f" style="--i:${i++}"><div class="box"><div class="pop">${faceSvg(id, "happy")}</div></div><span>${FACE_NAME[id]}</span></div>`).join("")}</div>`)
			}
			if (spec.lockup) parts.push(`<img class="lockup fade" style="--i:${i++}" src="/__demo/lockup.svg" alt="">`)
			if (spec.kicker) parts.push(`<div class="kicker fade" style="--i:${i++}">${spec.kicker}</div>`)
			for (const line of spec.lines || []) parts.push(`<div class="line ${spec.small ? "small" : ""}">${words(line)}</div>`)
			if (spec.sub) parts.push(`<div class="sub fade" style="--i:${i + 3}">${spec.sub}</div>`)
			if (spec.code) parts.push(`<div class="code fade" style="--i:${i + 5}">${spec.code}</div>`)
			titles.innerHTML = `<div class="card">${parts.join("")}</div>`
			for (const el of titles.querySelectorAll(".count")) countUp(el, Number(el.dataset.to))
			await sleep(760 + i * 75)
		},
		async untitle() {
			titles.classList.add("out")
			await sleep(520)
			titles.innerHTML = ""
			titles.classList.remove("out")
		},
		async caption(kicker, html) {
			if (caption.classList.contains("on")) {
				caption.classList.remove("on")
				await sleep(300)
			}
			if (!html) return
			caption.querySelector(".kicker").textContent = kicker || ""
			caption.querySelector(".kicker").style.display = kicker ? "" : "none"
			caption.querySelector(".text").innerHTML = html
			caption.classList.add("on")
		},
		cursor(x, y) {
			cursor.style.translate = `${x}px ${y}px`
		},
		showCursor(on) {
			cursor.classList.toggle("on", on)
		},
		press(down) {
			cursor.classList.toggle("down", down)
			if (down) {
				const ring = cursor.querySelector(".ring")
				ring.classList.remove("go")
				void ring.offsetWidth
				ring.classList.add("go")
			}
		},
	}

	function countUp(el, to, from = 0, delay = 250, ms = 1300) {
		const start = performance.now() + delay
		const decimals = String(to).split(".")[1]?.length ?? 0
		const step = (now) => {
			const t = Math.max(0, Math.min(1, (now - start) / ms))
			const v = from + (to - from) * (1 - (1 - t) ** 3)
			el.textContent = v.toLocaleString("en-US", { minimumFractionDigits: decimals, maximumFractionDigits: decimals })
			if (t < 1) requestAnimationFrame(step)
		}
		requestAnimationFrame(step)
	}
</script>
</body>
