<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Entangle demo</title>
<!--
	The director page of the demo video (scripts/demo/record.ts serves it). The app runs in the iframe; this page is the
	camera around it: it frames, zooms, blurs and cuts, and lays titles, captions and a cursor over it.
	All sizes are CSS px of a 1440×810 window; Chrome renders it at 4/3, so the video is 1920×1080.
-->
<style>
	@font-face { font-family: "Inter Variable"; font-weight: 100 900; src: url(/__demo/fonts/inter-latin-wght-normal.woff2) format("woff2"); }
	@font-face { font-family: "Inter Variable"; font-weight: 100 900; src: url(/__demo/fonts/inter-latin-ext-wght-normal.woff2) format("woff2"); unicode-range: U+0100-024F, U+1E00-1EFF; }
	@font-face { font-family: "Source Serif 4 Variable"; font-weight: 200 900; src: url(/__demo/fonts/source-serif-4-latin-wght-normal.woff2) format("woff2"); }
	@font-face { font-family: "Source Serif 4 Variable"; font-style: italic; font-weight: 200 900; src: url(/__demo/fonts/source-serif-4-latin-wght-italic.woff2) format("woff2"); }

	:root {
		--ink: #1d1d1f; --muted: #6e6e73; --subtle: #a1a1a6; --accent: #4c5bd4; --canvas: #f5f5f7; --panel: #ffffff;
		--ease: cubic-bezier(0.7, 0, 0.2, 1); --out: cubic-bezier(0.2, 0.8, 0.2, 1);
		--sans: "Inter Variable", Inter, system-ui, sans-serif; --serif: "Source Serif 4 Variable", Georgia, serif;
	}
	* { box-sizing: border-box; }
	html, body { margin: 0; height: 100%; overflow: hidden; background: var(--canvas); color: var(--ink); font-family: var(--sans);
		-webkit-font-smoothing: antialiased; }

	/* The backdrop the framed window floats on: a soft light from above, a faint dot grid. */
	#backdrop { position: fixed; inset: 0;
		background:
			radial-gradient(1100px 520px at 50% -12%, rgba(76, 91, 212, 0.13), transparent 70%),
			radial-gradient(800px 500px at 100% 110%, rgba(76, 91, 212, 0.07), transparent 70%),
			radial-gradient(circle at 1px 1px, rgba(29, 29, 31, 0.07) 1px, transparent 0) 0 0 / 22px 22px,
			var(--canvas); }

	#stage { position: fixed; inset: 0; perspective: 2600px; transition: filter 420ms var(--out), opacity 420ms var(--out), scale 420ms var(--out); }
	#stage.blur { filter: blur(22px) saturate(1.05); opacity: 0.28; scale: 0.97; }
	#stage.soft { filter: blur(6px); opacity: 0.7; }
	#cam { position: absolute; left: 0; top: 0; width: 1440px; height: 810px; transform-origin: 0 0; }
	#win { width: 100%; height: 100%; overflow: hidden; background: var(--panel); border-radius: 0;
		transition: border-radius 600ms var(--ease), box-shadow 600ms var(--ease); }
	#win.framed { border-radius: 14px; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.06), 0 30px 80px -20px rgba(29, 29, 31, 0.28), 0 12px 28px -12px rgba(29, 29, 31, 0.18); }
	#app { display: block; width: 1440px; height: 810px; border: 0; }

	/* Titles: words blur in one after another. */
	#titles { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; }
	#titles .card { display: flex; flex-direction: column; align-items: center; gap: 22px; max-width: 1120px; text-align: center; }
	#titles .kicker { font-size: 15px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); }
	#titles .line { font-family: var(--serif); font-weight: 500; font-size: 64px; line-height: 1.12; letter-spacing: -0.025em; }
	#titles .line.small { font-size: 46px; }
	#titles .sub { font-size: 22px; line-height: 1.5; color: var(--muted); max-width: 820px; }
	#titles .code { font-size: 20px; padding: 10px 18px; border-radius: 10px; background: rgba(29, 29, 31, 0.06); }
	#titles img.lockup { width: 400px; height: auto; }
	#titles .w { display: inline-block; white-space: pre; opacity: 0; filter: blur(12px); transform: translateY(18px);
		animation: word-in 760ms var(--out) forwards; animation-delay: calc(var(--i) * 75ms); }
	#titles .em { color: var(--accent); }
	#titles .fade { opacity: 0; animation: fade-in 700ms var(--out) forwards; animation-delay: calc(var(--i) * 75ms); }
	#titles.out .w, #titles.out .fade { animation: word-out 420ms var(--ease) forwards; animation-delay: calc(var(--i) * 18ms); }
	@keyframes word-in { to { opacity: 1; filter: blur(0); transform: none; } }
	@keyframes fade-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
	@keyframes word-out { from { opacity: 1; filter: blur(0); transform: none; } to { opacity: 0; filter: blur(10px); transform: translateY(-14px); } }

	/* The caption: a kicker and one sentence, low on the screen. */
	#caption { position: fixed; left: 50%; bottom: 26px; pointer-events: none; translate: -50% 12px; display: flex; flex-direction: column; align-items: center; gap: 6px;
		max-width: 1000px; padding: 14px 26px 15px; border-radius: 18px; text-align: center; opacity: 0;
		background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(16px) saturate(1.4);
		box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.05), 0 18px 40px -12px rgba(29, 29, 31, 0.22);
		transition: opacity 420ms var(--out), translate 420ms var(--out); }
	#caption.on { opacity: 1; translate: -50% 0; }
	#caption .kicker { font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); }
	#caption .text { font-size: 23px; font-weight: 500; line-height: 1.38; letter-spacing: -0.012em; }
	#caption .text b { font-weight: 650; }

	/* A macOS-like pointer, with a ring on click. */
	#cursor { position: fixed; left: 0; top: 0; width: 28px; height: 28px; pointer-events: none; opacity: 0; transition: opacity 240ms ease; z-index: 10; }
	#cursor.on { opacity: 1; }
	#cursor svg { position: absolute; left: -5px; top: -3px; width: 28px; height: 28px; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.25));
		transition: scale 140ms ease; transform-origin: 5px 3px; }
	#cursor.down svg { scale: 0.86; }
	#cursor .ring { position: absolute; left: -22px; top: -22px; width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--accent);
		opacity: 0; scale: 0.4; }
	#cursor .ring.go { animation: ring 560ms var(--out); }
	@keyframes ring { 0% { opacity: 0.9; scale: 0.4; } 100% { opacity: 0; scale: 1.25; } }
</style>
</head>
<body>
	<div id="backdrop"></div>
	<div id="stage"><div id="cam"><div id="win"><iframe id="app" title="Entangle"></iframe></div></div></div>
	<div id="titles"></div>
	<div id="caption"><div class="kicker"></div><div class="text"></div></div>
	<div id="cursor"><div class="ring"></div><svg viewBox="0 0 28 28"><path d="M5 3 L5 22 L10 17.5 L13.5 25 L17 23.4 L13.6 16 L20 16 Z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg></div>
<script>
	const W = 1440, H = 810
	const $ = (id) => document.getElementById(id)
	const sleep = (ms) => new Promise((done) => setTimeout(done, ms))
	const app = $("app"), cam = $("cam"), win = $("win"), stage = $("stage"), titles = $("titles"), caption = $("caption"), cursor = $("cursor")

	/** Where the camera is: screen = (tx, ty) + s × app. */
	let view = { s: 1, tx: 0, ty: 0, rx: 0, ry: 0 }

	function apply(next, ms, ease) {
		view = next
		cam.style.transition = ms ? `transform ${ms}ms ${ease || "var(--ease)"}` : "none"
		const { s, tx, ty, rx, ry } = next
		cam.style.transform =
			`translate(${tx}px, ${ty}px) scale(${s})` + (rx || ry ? ` translate(${W / 2}px, ${H / 2}px) rotateX(${rx}deg) rotateY(${ry}deg) translate(${-W / 2}px, ${-H / 2}px)` : "")
		if (!ms) void cam.offsetWidth
		return sleep(ms || 0)
	}

	/** The camera framings. A rect is in app px: the camera fits it to the screen, never showing past the window's edge. */
	function shot(spec) {
		if (spec === "full") return { s: 1, tx: 0, ty: 0, rx: 0, ry: 0 }
		if (spec === "frame" || spec === "tilt") {
			const s = 0.82
			return { s, tx: (W - W * s) / 2, ty: 30, rx: spec === "tilt" ? 14 : 0, ry: spec === "tilt" ? -9 : 0 }
		}
		const { x, y, w, h } = spec.rect
		const pad = spec.pad ?? 0.12
		let s = Math.min(W / (w * (1 + pad)), H / (h * (1 + pad)))
		s = Math.max(spec.min ?? 1, Math.min(spec.max ?? 2.4, s))
		let tx = W / 2 - s * (x + w / 2)
		let ty = H / 2 - s * (y + h / 2) + (spec.lift ?? 0)
		tx = Math.min(0, Math.max(W - W * s, tx))
		ty = Math.min(0, Math.max(H - H * s, ty))
		return { s, tx, ty, rx: 0, ry: 0 }
	}

	window.director = {
		load(url) {
			return new Promise((done) => {
				app.addEventListener("load", () => done(), { once: true })
				app.src = url
			})
		},
		camera(spec, ms = 1100, ease) {
			const next = shot(spec)
			win.classList.toggle("framed", next.s < 1)
			return apply(next, ms, ease)
		},
		/** App px to screen px, for the camera's target. */
		toScreen(x, y) {
			return { x: view.tx + view.s * x, y: view.ty + view.s * y }
		},
		blur(mode, ms = 420) {
			stage.classList.toggle("blur", mode === "blur")
			stage.classList.toggle("soft", mode === "soft")
			return sleep(ms)
		},
		/** Lines of a title card. `*word*` is accent, `{1047}` counts up, `[code]` is a code chip, `<img>` the lockup. */
		async title(spec) {
			titles.classList.remove("out")
			let i = 0
			// `*several words*` is accent; each word still animates on its own.
			const words = (text) =>
				text.split(/(\*[^*]+\*)/).map((segment) => {
					const em = /^\*([^*]+)\*$/.exec(segment)
					return (em ? em[1] : segment).split(/(\s+)/).map((part) => {
						if (!part || /^\s+$/.test(part)) return part
						const count = /^\{(\d+)\}(.*)$/.exec(part)
						const html = count ? `<span class="count" data-to="${count[1]}">0</span>${count[2]}` : part
						return `<span class="w${em ? " em" : ""}" style="--i:${i++}">${html}</span>`
					}).join("")
				}).join("")
			const parts = []
			if (spec.lockup) parts.push(`<img class="lockup fade" style="--i:${i++}" src="/__demo/lockup.svg" alt="">`)
			if (spec.kicker) parts.push(`<div class="kicker fade" style="--i:${i++}">${spec.kicker}</div>`)
			for (const line of spec.lines || []) parts.push(`<div class="line ${spec.small ? "small" : ""}">${words(line)}</div>`)
			if (spec.sub) parts.push(`<div class="sub fade" style="--i:${i + 3}">${spec.sub}</div>`)
			if (spec.code) parts.push(`<div class="code fade" style="--i:${i + 5}">${spec.code}</div>`)
			titles.innerHTML = `<div class="card">${parts.join("")}</div>`
			for (const el of titles.querySelectorAll(".count")) countUp(el, Number(el.dataset.to))
			await sleep(760 + i * 75)
		},
		async untitle() {
			titles.classList.add("out")
			await sleep(520)
			titles.innerHTML = ""
			titles.classList.remove("out")
		},
		async caption(kicker, html) {
			if (caption.classList.contains("on")) {
				caption.classList.remove("on")
				await sleep(300)
			}
			if (!html) return
			caption.querySelector(".kicker").textContent = kicker || ""
			caption.querySelector(".kicker").style.display = kicker ? "" : "none"
			caption.querySelector(".text").innerHTML = html
			caption.classList.add("on")
		},
		cursor(x, y) {
			cursor.style.translate = `${x}px ${y}px`
		},
		showCursor(on) {
			cursor.classList.toggle("on", on)
		},
		press(down) {
			cursor.classList.toggle("down", down)
			if (down) {
				const ring = cursor.querySelector(".ring")
				ring.classList.remove("go")
				void ring.offsetWidth
				ring.classList.add("go")
			}
		},
	}

	function countUp(el, to) {
		const start = performance.now() + 250, ms = 1300
		const step = (now) => {
			const t = Math.max(0, Math.min(1, (now - start) / ms))
			el.textContent = Math.round(to * (1 - (1 - t) ** 3)).toLocaleString("en-US")
			if (t < 1) requestAnimationFrame(step)
		}
		requestAnimationFrame(step)
	}
</script>
</body>
</html>
